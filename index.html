<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sombra e Luna: A Noite do Rei Fantasma</title>
  <style>
    :root { --bg: #07060c; --fg: #ece9f5; --ac: #7dff9a; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: Georgia, 'Times New Roman', serif; overflow: hidden; touch-action: none; }
    #w { position: relative; max-width: 960px; margin: 0 auto; user-select: none }

    h1 { margin: 0; font-size: 2.7em; letter-spacing: .05em; color: var(--ac); text-shadow: 0 0 18px #2a9d4a, 0 3px 0 #000 }
    h2 { margin: .2em 0; font-size: 2em; text-shadow: 0 2px 0 #000 }
    p { margin: .3em 0 .7em; text-shadow: 0 1px 3px #000; max-width: 80% }
    button { font: inherit; background: #171424e6; color: var(--fg); border: 1px solid #5b5675; border-radius: 8px; padding: .5em 1.4em; margin: .25em; cursor: pointer }
    button:hover:not(:disabled) { border-color: var(--ac); color: var(--ac) }
    button:disabled { opacity: .45; cursor: not-allowed; border-color: #333; color: #777 }
    .gr { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4em; width: 94% }
    .gr button { padding: .5em .2em; margin: 0; font-size: .82em }
    #tc { display: flex; justify-content: space-between; padding: 6px; max-width: 960px; margin: 0 auto }
    #tc button { padding: .9em 1.1em; font-size: 14px; touch-action: none }
    #pauseBtn { position: absolute; top: 40px; left: 14px; z-index: 100; padding: 6px 12px; font-size: 14px; font-weight: bold; background: #171424cc; border: 2px solid #5b5675; border-radius: 6px; color: #fff; cursor: pointer; pointer-events: auto; }
    @media(hover:hover) { #tc { display: none } }

    /* Tela cheia real: o navegador esconde a barra quando oferece suporte à Fullscreen API. */
    :fullscreen { width:100%; height:100%; background:var(--bg); }
    :fullscreen body { width:100%; height:100%; height:100dvh; margin:0; overflow:hidden; }
    :fullscreen #w { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; max-width:none; margin:0; overflow:hidden; }
    :fullscreen #w canvas { width:100vw; height:100vh; height:100dvh; max-width:none; }
    :fullscreen #ui { inset:0; box-sizing:border-box; overflow:hidden; }
    :fullscreen #tc { position:fixed; left:0; right:0; bottom:max(22px, calc(env(safe-area-inset-bottom, 0px) + 18px)); z-index:1000; }
    #fullscreenHelp { font-size:clamp(11px, 1.6vw, 14px); opacity:.85; }

    #rotateNotice { display:none; position:fixed; inset:0; z-index:99999; background:radial-gradient(ellipse at center,#211735 0%,#07060c 75%); color:#ece9f5; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px; box-sizing:border-box; font-family:Georgia,'Times New Roman',serif; }
    #rotateNotice .rotateIcon { font-size:clamp(56px,15vw,90px); line-height:1.2; margin-bottom:18px; animation:rotatePhone 1.8s ease-in-out infinite; }
    #rotateNotice h2 { color:#7dff9a; font-size:clamp(22px,6vw,34px); margin:0 0 12px; }
    #rotateNotice p { max-width:340px; font-size:clamp(15px,4vw,19px); line-height:1.5; }
    @keyframes rotatePhone { 0%,20% { transform:rotate(0deg) } 65%,100% { transform:rotate(90deg) } }
    @media (orientation:portrait) and (max-width:900px) and (pointer:coarse) { #rotateNotice { display:flex; } }

    /* Celular na horizontal: o jogo ocupa a viewport inteira, sem ser cortado. */
    @media (orientation:landscape) and (max-width:900px) and (pointer:coarse) {
      html, body { width:100%; height:100%; height:100dvh; overflow:hidden; }
      #w { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; max-width:none; margin:0; overflow:hidden; }
      #w canvas { display:block; width:100vw; height:100vh; height:100dvh; max-width:none; }
      #ui { inset:0; width:100%; height:100%; box-sizing:border-box; padding: max(8px, env(safe-area-inset-top)) 8px max(56px, env(safe-area-inset-bottom)); overflow:hidden; }
      #tc { position:fixed; left:0; right:0; bottom:max(22px, calc(env(safe-area-inset-bottom, 0px) + 18px)); z-index:1000; display:flex; justify-content:space-between; align-items:flex-end; box-sizing:border-box; width:100%; max-width:none; margin:0; padding:0 8px; gap:8px; pointer-events:none; }
      #tc > span { display:flex; gap:5px; pointer-events:auto; }
      #tc button { margin:0; padding:clamp(7px, 2.2vh, 13px) clamp(9px, 2vw, 18px); font-size:clamp(11px, 2.6vh, 15px); min-width:38px; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
      #pauseBtn { top:max(6px, env(safe-area-inset-top)); left:max(6px, env(safe-area-inset-left)); z-index:1200; font-size:12px; padding:5px 8px; }
      .gr { gap:clamp(2px, .8vw, 8px); }
      .gr button { padding:.35em .12em; font-size:clamp(9px, 1.8vh, 13px); }
    }
  </style>
</head>

<body>
  <div id="rotateNotice" role="alert" aria-live="assertive"><div class="rotateIcon" aria-hidden="true">📱</div><h2>Gire seu celular!</h2><p>Para jogar <strong>Sombra e Luna</strong>, coloque o celular na horizontal.</p><p>O jogo ficará pausado até você girar a tela.</p></div>
  <div id="w">
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <button id="pauseBtn" style="display:none;" onclick="togglePause()">⏸ PAUSA</button>
  </div>
  <div id="tc">
    <span><button data-k="TL">&lt;</button><button data-k="TR">&gt;</button></span>
    <span><button data-k="TJ">PULAR</button><button data-k="TF">ATIRAR</button></span>
  </div>
  
  <script>
    const $ = i => document.getElementById(i), C = $('c'), X = C.getContext('2d'), LC = document.createElement('canvas'), g = LC.getContext('2d'), W = 960, H = 540, GY = 455, PI = Math.PI;
    C.width = W; C.height = H; LC.width = 320; LC.height = 180;
    let unlock = 1, score = 0, muted = false, seen = 0, paused = false;
    let xp = 0, weaponLevel = 0;
    try {
      unlock = Math.max(1, Math.min(10, +localStorage.getItem('gu_v4') || 1));
      score = +localStorage.getItem('gs_v2') || 0;
      seen = +localStorage.getItem('gi_v2') || 0;
      xp = Math.max(0, +localStorage.getItem('gxp_v3') || 0);
      weaponLevel = Math.max(0, Math.min(4, +localStorage.getItem('gwl_v3') || 0));
    } catch (e) { }
    const sv = () => { try {
      localStorage.setItem('gu_v4', unlock); localStorage.setItem('gs_v2', score); localStorage.setItem('gi_v2', seen);
      localStorage.setItem('gxp_v3', xp); localStorage.setItem('gwl_v3', weaponLevel);
    } catch (e) { } };
    const xpToNext = () => 100 + weaponLevel * 75;
    const lv = () => weaponLevel;
    function gainXP(amount, x, y) {
      if (weaponLevel >= 4) {
        FT.push({ x, y, t: '+' + amount + ' XP', l: 55, c: '#7dff9a' });
        return;
      }
      xp += amount;
      FT.push({ x, y, t: '+' + amount + ' XP', l: 55, c: '#7dff9a' });
      let leveled = false;
      while (weaponLevel < 4 && xp >= xpToNext()) {
        xp -= xpToNext(); weaponLevel++; leveled = true;
        FT.push({ x, y: y - 35, t: 'ARMA SUBIU! Nv ' + (weaponLevel + 1), l: 100, c: '#ff6ad5' });
        burst(x, y, WP[weaponLevel].col, 22); sfx('pick');
      }
      if (weaponLevel >= 4) xp = 0;
      sv();
    }
    const R = (i, s) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5; return v - Math.floor(v) };

    /* ---------- AUDIO ---------- */
    let AC, MG, NB, T = null, trk = '', stp = 0, nT = 0;
    function au() {
      if (AC) { if (AC.state == 'suspended') AC.resume(); return }
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = muted ? 0 : .45; MG.connect(AC.destination);
        NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++)d[i] = Math.random() * 2 - 1; nT = AC.currentTime + .1; setInterval(seq, 60)
      } catch (e) { }
    }
    const hz = n => 440 * Math.pow(2, (n - 9) / 12);
    function tn(n, t, d, ty, v) { const o = AC.createOscillator(), q = AC.createGain(); o.type = ty; o.frequency.value = hz(n); q.gain.setValueAtTime(v, t); q.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(q); q.connect(MG); o.start(t); o.stop(t + d + .02) }
    function sx(f1, f2, d, ty, v) { if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), q = AC.createGain(); o.type = ty; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d); q.gain.setValueAtTime(v, t); q.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(q); q.connect(MG); o.start(t); o.stop(t + d + .02) }
    function nz(t, d, v, f) { const s = AC.createBufferSource(), q = AC.createGain(), h = AC.createBiquadFilter(); s.buffer = NB; h.type = 'highpass'; h.frequency.value = f; q.gain.setValueAtTime(v, t); q.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(h); h.connect(q); q.connect(MG); s.start(t); s.stop(t + d + .02) }
    const SFX = {
      shoot: () => sx(900, 300, .08, 'square', .05), jump: () => sx(300, 700, .12, 'square', .04), hurt: () => sx(320, 70, .28, 'sawtooth', .1), pick: () => sx(600, 1300, .18, 'triangle', .09),
      roar: () => sx(130, 35, .7, 'sawtooth', .14), die: () => sx(420, 60, .3, 'square', .06), hit: () => { if (AC) nz(AC.currentTime, .08, .12, 900) }, win: () => { [0, 4, 7, 12].forEach((n, i) => AC && tn(n + 12, AC.currentTime + i * .12, .3, 'square', .07)) }
    };
    const sfx = k => { if (AC && !paused) SFX[k]() };
    function mus(k, sd = 0) {
      const key = k + sd; if (trk == key) return; trk = key; stp = 0; if (AC) nT = AC.currentTime + .1;
      const bossTrack = k == 'boss' || k == 'boss2';
      const mi = bossTrack || k == 'story';
      const stageBpm = [132,118,126,104,138,112,96,108,144,88];
      let bpm = k == 'boss2' ? stageBpm[sd % 10] + 22 : k == 'boss' ? stageBpm[sd % 10] + 8 : k == 'story' ? 66 : k == 'menu' ? 104 : stageBpm[sd % 10];
      const modes = [[0,3,5,7,10],[0,2,3,7,9],[0,2,5,7,10],[0,3,5,8,10],[0,2,4,7,9],[0,3,5,6,10],[0,3,6,7,10],[0,2,4,7,11],[0,3,5,8,10],[0,3,7,8,10]];
      let sc = mi ? modes[sd % 10] : [0, 2, 4, 7, 9];
      if (k == 'boss' && sd == 9) { bpm = 96; sc = [0, 3, 7, 8, 10]; }
      if (k == 'boss2' && sd == 9) { bpm = 118; sc = [0, 3, 7, 8, 10]; }
      T = {
        k, sd, sc, r: [0, 2, 5, 7, 9, 4, 10, 3, 8, 1][sd % 10], bpm: bpm, wave: ['triangle','square','sawtooth','triangle','square','sawtooth','triangle','square','sawtooth','sawtooth'][sd % 10],
        mel: Array.from({ length: 16 }, (_, i) => R(i, sd + (bossTrack ? (k == 'boss2' ? 75 : 50) : k == 'menu' ? 90 : 0)) > (bossTrack ? (k == 'boss2' ? .18 : .26) : .4) ? Math.floor(R(i, sd + 7) * 5) + (R(i, sd + 3) > .7 ? 5 : 0) : -1)
      }
    }
    function seq() {
      if (!AC || !T || paused) return;
      while (nT < AC.currentTime + .25) {
        const sp = 60 / T.bpm / 4, i = stp % 16, bar = Math.floor(stp / 16) % 4, bo = T.k == 'boss' || T.k == 'boss2', rage = T.k == 'boss2', sy = T.k == 'story', mn = T.k == 'menu', m = T.mel[i];
        let brega = bo && T.sd == 9;
        if (!sy && m >= 0) { const timbre = bo ? (rage ? 'sawtooth' : T.wave) : (T.sd % 3 == 0 ? 'square' : T.sd % 3 == 1 ? 'triangle' : 'sine'); tn(T.r + T.sc[m % 5] + 12 * Math.floor(m / 5) + (rage && i % 4 == 2 ? 12 : 0), nT, sp * (rage ? 1.05 : bo ? 1.25 : 1.6), timbre, rage ? .075 : bo ? .065 : .05); }
        if (rage && (i == 0 || i == 6 || i == 8 || i == 14)) tn(T.r - 24 + (i == 8 ? 2 : 0), nT, sp * 2.8, 'sawtooth', .17);
        if (rage && (i == 4 || i == 12)) nz(nT, .16, .18, 800);
        if (sy && i % 4 == 0 && R(i + bar, 5) > .3) tn(T.r + T.sc[Math.floor(R(i + bar, T.sd) * 5)] + 12, nT, sp * 5, 'triangle', .12);
        if (!sy && (i % 4 == 0 || (bo && (rage ? i % 2 == 0 : (T.sd == 1 || T.sd == 4 || T.sd == 8 ? i % 3 == 0 : i % 2 == 0))) || (brega && i % 8 == 6))) {
            let note = T.r - 12 + (bar % 2 ? T.sc[2] : 0);
            if (brega && i % 8 == 6) note += 5;
            tn(note, nT, sp * (bo ? 1.2 : 2), brega ? 'square' : 'triangle', .15);
        }
        if (!sy && !mn) {
          if (brega) {
              if (i == 0 || i == 5 || i == 8 || i == 13) {
                  const o = AC.createOscillator(), q = AC.createGain();
                  o.frequency.setValueAtTime(140, nT); o.frequency.exponentialRampToValueAtTime(40, nT + .1);
                  q.gain.setValueAtTime(.35, nT); q.gain.exponentialRampToValueAtTime(.001, nT + .15);
                  o.connect(q); q.connect(MG); o.start(nT); o.stop(nT + .18);
              }
              if (i == 4 || i == 12) nz(nT, .15, .2, 1000);
              if (i % 2 == 0) nz(nT, .03, .05, 6000);
          } else {
              if (i % 4 == 0) { const o = AC.createOscillator(), q = AC.createGain(); o.frequency.setValueAtTime(130, nT); o.frequency.exponentialRampToValueAtTime(40, nT + .12); q.gain.setValueAtTime(.2, nT); q.gain.exponentialRampToValueAtTime(.001, nT + .14); o.connect(q); q.connect(MG); o.start(nT); o.stop(nT + .16) }
              if (i % 8 == 4) nz(nT, .12, .1, 1500);
              if (bo || i % 2 == 1) nz(nT, .03, rage ? .075 : .04, rage ? 4800 : 7000)
          }
        }
        nT += sp; stp++
      }
    }

    /* ---------- INPUT ---------- */
    const K = {};
    addEventListener('keydown', e => {
      if (telaVertical()) { e.preventDefault(); atualizarOrientacao(); return; }
      au(); K[e.code] = 1;
      if (mode == 'arrive' && (e.code == 'Enter' || e.code == 'Escape')) arrSkip();
      if (e.code.startsWith('Arrow') || e.code == 'Space') e.preventDefault();
      if (e.code == 'KeyM') { muted = !muted; if (MG) MG.gain.value = muted ? 0 : .45 }
      if (e.code == 'Escape') {
          if (mode == 'cut') csEnd();
          else if (mode == 'play') togglePause();
      }
      if (e.code == 'KeyP' && mode == 'play') togglePause();
      if (mode == 'cut' && !e.repeat && (e.code == 'Space' || e.code == 'Enter')) csNext();
      if (mode == 'talk' && !e.repeat && (e.code == 'Space' || e.code == 'Enter')) tkNext();
    });
    addEventListener('keyup', e => K[e.code] = 0);
    C.addEventListener('pointerdown', e => { if (telaVertical()) { e.preventDefault(); return; } au(); K.F = 1; if (mode == 'cut') csNext(); if (mode == 'talk') tkNext(); if (mode == 'arrive') arrSkip() }); addEventListener('pointerup', () => K.F = 0);
    // Controles por toque: captura o ponteiro para manter o botão ativo enquanto o dedo estiver pressionado.
    // Não limpar no pointerleave: em celulares isso pode disparar durante um toque e interromper o tiro.
    document.querySelectorAll('#tc button').forEach(b => {
      const k = b.dataset.k;
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (telaVertical()) { atualizarOrientacao(); return; }
        au();
        K[k] = 1;
        try { b.setPointerCapture(e.pointerId); } catch (_) {}
      });
      const soltar = e => { if (e) e.preventDefault(); K[k] = 0; };
      b.addEventListener('pointerup', soltar);
      b.addEventListener('pointercancel', soltar);
      b.addEventListener('lostpointercapture', () => { K[k] = 0; });
      b.addEventListener('contextmenu', e => e.preventDefault());
    });

    function togglePause() {
        if(mode === 'menu' || mode === 'cut') return;
        paused = !paused;
        if(paused) { ui(`<h2>PAUSADO</h2><button onclick="togglePause()">Continuar</button><button onclick="goHome()">Menu Principal</button>`); }
        else { ui(''); }
    }
    function goHome() { paused = false; menu(); }

    /* ---------- DADOS ---------- */
    const ST = [
      { n: 'Cemitério Velho', a: '#150d28', b: '#4a2d6b', gr: '#1c1826', pc: '#5b5470', d: 'tomb', fog: .1, zc: '#51406a', s: 'Rastros de Luna levam ao cemitério. Cuidado com os mortos.', B: { n: 'Coveiro Sombrio', kd: 'k', c1: '#2a2438', c2: '#cfc7e6', w: 'shovel', at: ['dash', 'slam', 'shoot'], hp: 120, sc: 1.5 } },
      { n: 'Escola Abandonada', a: '#111820', b: '#35454b', gr: '#1d2830', pc: '#7a6548', d: 'school', fog: .12, zc: '#2f5aa0', s: 'Um bilhete de Luna na lousa: "me levaram para o fundo da escola".', B: { n: 'Diretora Lúgubre', kd: 'f', c1: '#3a2a4a', c2: '#ffd24a', w: 'ruler', at: ['shoot', 'rain', 'summon'], hp: 180, sc: 1.7 } },
      { n: 'Floresta Sombria', a: '#07140e', b: '#1c4a35', gr: '#0f1f15', pc: '#4a3a28', d: 'tree', fog: .18, zc: '#3a5a3a', s: 'As árvores sussurram o nome de Luna. Siga a trilha.', B: { n: 'Guardião Musgoso', kd: 'b', c1: '#3f5a2a', c2: '#e8d9a0', w: 'club', at: ['slam', 'dash', 'summon'], hp: 220, sc: 1.7 } },
      { n: 'Pântano Nebuloso', a: '#0b1a1c', b: '#2f6a62', gr: '#142a26', pc: '#3d5a4f', d: 'swamp', fog: .35, zc: '#4a6a4a', s: 'Pegadas de Luna somem na neblina do brejo.', B: { n: 'Rainha do Brejo', kd: 'f', c1: '#1f5a48', c2: '#9dffc8', w: 'staff', at: ['rain', 'shoot', 'dash'], hp: 280, sc: 1.8 } },
      { n: 'Vila Abandonada', a: '#1a1020', b: '#8a4a3a', gr: '#2a1e1a', pc: '#6a4a3a', d: 'town', fog: .12, zc: '#6a4a2a', s: 'Uma luz de lanterna ao longe: alguém sabe onde ela está.', B: { n: 'Lanterneiro Louco', kd: 'k', c1: '#4a2a18', c2: '#ffd27a', w: 'lantern', at: ['dash', 'shoot', 'slam', 'summon'], hp: 350, sc: 1.55 } },
      { n: 'Catacumbas', a: '#0a0c18', b: '#2a3355', gr: '#1a1d2b', pc: '#555d78', d: 'cata', fog: .2, zc: '#5a5a6a', s: 'Nas profundezas, o miado de Luna ecoa. Ela está perto.', B: { n: 'Senhor dos Ossos', kd: 'b', c1: '#aaa89a', c2: '#ff5a3a', w: 'axe', at: ['slam', 'dash', 'shoot', 'summon'], hp: 420, sc: 1.8 } },
      { n: 'Igreja em Ruínas', a: '#10102a', b: '#5a4a9a', gr: '#1d1b33', pc: '#6a609a', d: 'church', fog: .15, zc: '#4a3a7a', s: 'Os sinos tocam sozinhos. O Rei esteve aqui.', B: { n: 'Bispo Corrompido', kd: 'f', c1: '#4a1a5a', c2: '#ff8aff', w: 'cross', at: ['rain', 'shoot', 'summon', 'dash'], hp: 500, sc: 1.85 } },
      { n: 'Montanha Gelada', a: '#0c1a30', b: '#7fb4d8', gr: '#2b3d52', pc: '#8ab4d0', d: 'ice', fog: .25, zc: '#3a6a9a', s: 'O frio corta, mas o cheiro de Luna ainda está no vento.', B: { n: 'Imperatriz do Gelo', kd: 'k', c1: '#3a6a9a', c2: '#d8f4ff', w: 'spear', at: ['dash', 'shoot', 'slam', 'summon'], hp: 580, sc: 1.6 } },
      { n: 'Campo de Lava', a: '#200808', b: '#b0401a', gr: '#2b1210', pc: '#7a3a2a', d: 'lava', fog: .1, zc: '#8a3a1a', s: 'O castelo do Rei já aparece no horizonte, além do fogo.', B: { n: 'Cavaleiro de Brasas', kd: 'b', c1: '#7a1a0a', c2: '#ffb050', w: 'axe', at: ['slam', 'dash', 'shoot', 'summon'], hp: 650, sc: 1.9 } },
      { n: 'Castelo do Rei Fantasma', a: '#050510', b: '#3a1a6a', gr: '#15102a', pc: '#4a3a7a', d: 'castle', fog: .3, zc: '#4a2a5a', s: 'O último salão. Luna está logo atrás da porta do Rei.', B: { n: 'Rei Fantasma', kd: 'f', c1: '#2a1a4a', c2: '#c58bff', w: 'crown', at: ['rain', 'shoot', 'dash', 'summon', 'slam'], hp: 800, sc: 2.2 } }
    ];
    const WN = ['Pistola Velha', 'Pistola maiomeno', 'Pistola Top', 'Pistola Massa', 'Rambão'];
    const WP = [
      { d: 1, c: 24, n: 1, pr: 1, col: '#ffd76a' },
      { d: 1.4, c: 19, n: 1, pr: 1, col: '#ffb347' },
